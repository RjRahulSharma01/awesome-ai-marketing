name: Momentum Index

on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday, 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch signals and rebuild the index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 momentum/momentum.py

      - name: Commit the new numbers
        run: |
          git config user.name "momentum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add momentum/
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "Momentum Index: update for $(date -u +%Y-%m-%d)"
            git push
          fi
